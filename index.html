<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script type="module" src="./script.js"></script>
</head>
<body>
    <div class="choices">
        <button id="rock" class="choice">Rock</button>
        <button id="paper" class="choice">Paper</button>
        <button id="scissors" class="choice">Scissors</button>
    </div>
    <div class="game-results"></div>
    <div class="running-score">
        <div class="human-score"></div>
        <div class="computer-score"></div>
    </div>
    <div class="winner"></div>
</body>
</html>
