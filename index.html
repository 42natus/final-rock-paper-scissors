<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/script.js"></script>
</head>
<body>
    <div class="container">
        <div class="choices">
            <button id="rock" class="choice">Rock</button>
            <button id="paper" class="choice">Paper</button>
            <button id="scissors" class="choice">Scissors</button>
        </div>
        <div class="game-results"></div>
        <div class="running-score">
            <div class="human-score">You: _</div>
            <div class="computer-score">Computer: _</div>
        </div>
    </div>
    <button class="reset">Play Again</button>
</body>
</html>
